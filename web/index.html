<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FPV Spot Finder</title>
  <meta name="theme-color" content="#0f1417" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ff3d7f' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffc23d'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo"></span><span>FPV Spot Finder</span><span id="region-name" class="muted"></span></div>
      <div class="seg" id="profile-switch" role="tablist" aria-label="Drone">
        <button data-profile="freestyle5" role="tab">5" freestyle</button>
        <button data-profile="cine85" role="tab">85 mm cine</button>
      </div>
      <div class="top-actions">
        <button id="btn-layers" class="ghost" aria-haspopup="true">Layers</button>
        <button id="btn-about" class="ghost">How it works</button>
      </div>
      <div id="layers-pop" class="pop" hidden>
        <label><input type="checkbox" id="lyr-heat" checked /> Spot heatmap</label>
        <label><input type="checkbox" id="lyr-legal" checked /> Where you can't fly (this drone)</label>
        <label><input type="checkbox" id="lyr-zones" checked /> Airport / prison no-fly zones</label>
        <label><input type="checkbox" id="lyr-spots" checked /> Spot pins</label>
        <hr />
        <div class="seg small" id="basemap-switch">
          <button data-base="map">Map</button>
          <button data-base="satellite">Satellite</button>
        </div>
      </div>
    </header>

    <aside id="sidebar">
      <div class="side-head">
        <div class="side-tabs seg small" id="list-sort">
          <button data-sort="score">Best</button>
          <button data-sort="taste">My taste</button>
          <button data-sort="near">Near me</button>
        </div>
        <input id="search" type="search" placeholder="Filter by name or place" autocomplete="off" />
      </div>
      <div id="taste-note" class="note" hidden></div>
      <ol id="spot-list"></ol>
      <div id="seeds-box"></div>
    </aside>

    <main id="map"></main>

    <section id="detail" hidden>
      <div class="detail-scroll">
        <button class="close" id="detail-close" aria-label="Close">×</button>
        <div id="detail-body"></div>
      </div>
    </section>

    <div id="fly-check" class="toast" hidden></div>

    <dialog id="about">
      <form method="dialog"><button class="close" aria-label="Close">×</button></form>
      <div id="about-body"></div>
    </dialog>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
