[project]
name = "fpv-spot-finder"
version = "0.1.0"
description = "Finds legal, interesting FPV drone spots in the UK from height data, map data and your own ratings."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scipy>=1.11",
    "pyarrow>=15",
    "mercantile>=1.2",
    "requests>=2.31",
    "tqdm>=4.66",
    "pillow>=10",
    "osmium>=3.7",
    "mapbox-vector-tile>=2.0",
    "edt>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spotfinder = "spotfinder.cli:main"

[tool.setuptools.packages.find]
include = ["spotfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
