server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json application/geo+json;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Hashed bundles never change; the shell, service worker and data must revalidate.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # nginx's mime.types has no .geojson, so without the type below the spot files go out as
    # application/octet-stream and nothing compresses them (600 kB a drone instead of ~100 kB).
    # (A types block replaces the whole list, hence only inside these locations.)
    location /data/ {
        add_header Cache-Control "no-cache";
        location ~ \.geojson$ { types { } default_type application/geo+json; add_header Cache-Control "no-cache"; }
    }
    # your own re-ranked copy of a region, written by the API ("Re-rank with my ratings")
    location /mine/ {
        alias /srv/mine/;
        add_header Cache-Control "no-cache";
        location ~ \.geojson$ { types { } default_type application/geo+json; add_header Cache-Control "no-cache"; }
    }

    location / { try_files $uri $uri/ /index.html; }
}
