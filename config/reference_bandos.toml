# Known big bandos in Germany (NRW, from Tamair, 24 Oct 2026), kept as a yardstick for what a real
# bando looks like in OSM. No German LiDAR, so these aren't scored; they only inform the bando rules.
# lat/lon are where the OSM feature actually is (`given` is the coordinate in Tamair's list when it
# was off). `osm` is what OSM says there (Geofabrik 2026-10-23), so you can see how little of it
# says "abandoned".

[[bando]]
name = "Kraftwerk Shamrock, Herne"
lat = 51.5269
lon = 7.1810
osm = "landuse=industrial + disused:power=plant; two cooling towers abandoned:building=yes + abandoned:man_made=tower; brownfield next door"
why = "Coal power plant shell and cooling towers"

[[bando]]
