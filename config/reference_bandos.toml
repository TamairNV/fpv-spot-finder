lat = 51.5139
lon = 7.4403
osm = "landuse=industrial (45 ha), brick building=industrial halls 2-15k m2, several demolished:building nearby; no lifecycle tags"
why = "Gutted steel mill halls, pillars, tunnels"

[[bando]]
