# Real places people fly (or that are obviously worth a look), used to check the scorer.
# `python -m spotfinder eval` scores the region and says, for each one, where it lands and why.
# They are not taste seeds: they don't steer the ranking, they only grade it.
#
# profiles = which drones it should show up for ("freestyle5", "cine5", "cine85")
# kinds    = what makes it a spot, so misses can be grouped (viaduct, bridge, beach, coast, bando,
#            ruin, landmark, hill, river, trees, park, quarry, urban)
# source   = where it came from: "tamair" (said so), "web" (FPV/drone videos or drone-club spot
#            listings found online), "osm+local" (well-known landmark, coords from OSM)
# Coordinates come from the OSM feature unless `approx = true`.
# Legality isn't graded here: plenty of these are NT land, railway or busy; the app labels that.

[[spot]]
name = "Nine Arches (Lockhaugh) Viaduct, Derwent Walk"
lat = 54.93360
lon = -1.71985
radius_m = 150
profiles = ["cine5", "freestyle5"]
kinds = ["viaduct", "river", "trees"]
source = "tamair"
why = "Nine-arch disused railway viaduct ~25 m over the Derwent, now a footpath; arches to fly through, river and woods either side."

